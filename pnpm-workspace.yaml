packages:
  # The published package is the workspace root - it has to be listed for changesets
  # (via @manypkg/get-packages) to version and publish it.
  - '.'
  - test/*

allowBuilds:
  esbuild: false

publicHoistPattern:
  - typescript
  - vitest
  - '@vitejs/plugin-react'
  - '@types/react'
  - '@types/react-dom'

peerDependencyRules:
  allowAny:
    - react
    - react-dom

minimumReleaseAgeExclude:
  - react-dom@0.0.0-experimental-a1124489-20260826
  - react@0.0.0-experimental-a1124489-20260826
  - scheduler@0.0.0-experimental-a1124489-20260826
